<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PSeInt Static Analyzer</title>
    <link rel="stylesheet" href="Analysis_style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>PSeInt Static Module Analyzer</h1>
        </header>

        <section class="modulo-card card-padre">
            <div class="modulo-header">
                <div class="header-left">
                    <span class="label-padre">Archivo de Dependencias</span>
                    <input type="file" id="filePadre" accept=".txt,.psc" onchange="detectarCargaArchivoManual(this)" style="display:none;">
                    <label for="filePadre" class="btn-cargar-codigo">Seleccionar Archivo</label>
                </div>
                
                <div class="header-right">
                    <button onclick="procesarArchivoPadreManual()" class="btn-cargar-codigo">Analizar Código</button>
                    <button class="btn-buscar-deps" onclick="solicitarAnalisis()">Solicitar Análisis</button>
                </div>
            </div>
            <div class="modulo-body body-padre">
                <textarea id="codigoPadreManual" class="modulo-codigo" placeholder="Pega aquí el código de la librería padre..."></textarea>
            </div>
            <div id="statusPadre" class="status-bar">Estado: Esperando archivo...</div>
        </section>

        <main id="contenedorModulos">
            <section class="modulo-card" data-id="1">
                <div class="modulo-header">
                    <input type="text" class="modulo-prefijo" placeholder="Prefix">
                    <div class="header-right">
                        <button class="btn-ejecutar-modulo" onclick="ejecutarAnalisisIndividual(this)">Run Analysis</button>
                    </div>
                </div>
                <div class="modulo-body">
                    <div class="editor-section">
                        <textarea class="modulo-codigo" spellcheck="false" placeholder="Pega aquí el código de tu módulo..."></textarea>
                    </div>
                    <div class="report-section" id="report-1">
                        <div class="vacio-hint">Run analysis to see results</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/auxiliar_processor.js"></script>
    <script src="js/ui_renderer.js"></script>
    <script src="js/main_controller.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
