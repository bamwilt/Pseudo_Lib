<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor de Módulos Simple</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f4f4; text-align: center; }
        .caja { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .controles { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        button { background: #2b6cb0; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #2c5282; }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
        pre { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 5px; text-align: left; white-space: pre-wrap; word-wrap: break-word; min-height: 150px; }
        h3 { margin-top: 0; color: #4a5568; }
    </style>
</head>
<body>

    <h2>📖 Visor de Módulos</h2>

    <!-- PASO 1: Cargar la carpeta entera -->
    <div class="caja" id="seccionCarga">
        <h3>1. Selecciona tu carpeta de archivos TXT</h3>
        <input type="file" id="selectorCarpeta" webkitdirectory directory multiple>
    </div>

    <!-- PASO 2: El visor con los botones -->
    <div class="caja" id="seccionVisor" style="display: none;">
        <h3 id="nombreArchivo">Archivo: -</h3>
        
        <!-- Aquí se mostrará el contenido del TXT -->
        <pre id="contenidoTexto">Selecciona una carpeta para empezar...</pre>

        <div class="controles">
            <button id="btnAnterior" onclick="cambiarArchivo(-1)">&lt; Izquierda</button>
            <span id="indicadorPosicion">0 / 0</span>
            <button id="btnSiguiente" onclick="cambiarArchivo(1)">Derecha &gt;</button>
        </div>
    </div>

    <script>
        // Lista donde guardaremos los archivos en la memoria del navegador
        let listaArchivos = [];
        let indiceActual = 0;

        // Detectar cuando el usuario selecciona la carpeta entera
        document.getElementById('selectorCarpeta').addEventListener('change', async (e) => {
            const archivos = Array.from(e.target.files);
            
            // Filtrar para quedarnos solo con los que terminan en .txt
            listaArchivos = archivos.filter(a => a.name.toLowerCase().endsWith('.txt'));

            if (listaArchivos.length === 0) {
                alert("No se encontraron archivos .txt en esa carpeta.");
                return;
            }

            // Ordenar los archivos alfabéticamente (pag1, pag2, pag3...)
            listaArchivos.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

            // Ocultar el selector y mostrar el visor
            document.getElementById('seccionCarga').style.display = 'none';
            document.getElementById('seccionVisor').style.display = 'block';

            // Mostrar el primer archivo
            indiceActual = 0;
            mostrarArchivoActual();
        });

        // Función para leer y mostrar el archivo según el índice
        async function mostrarArchivoActual() {
            const archivo = listaArchivos[indiceActual];
            
            // Actualizar el título del archivo y el contador de abajo
            document.getElementById('nombreArchivo').innerText = `Archivo: ${archivo.name}`;
            document.getElementById('indicadorPosicion').innerText = `${indiceActual + 1} / ${listaArchivos.length}`;

            // Leer el texto del archivo y meterlo en la etiqueta <pre>
            const texto = await archivo.text();
            document.getElementById('contenidoTexto').innerText = texto;

            // Bloquear botones si llegamos al principio o al final
            document.getElementById('btnAnterior').disabled = (indiceActual === 0);
            document.getElementById('btnSiguiente').disabled = (indiceActual === listaArchivos.length - 1);
        }

        // Función que se ejecuta al pulsar Izquierda (-1) o Derecha (1)
        function cambiarArchivo(direccion) {
            indiceActual += direccion;
            mostrarArchivoActual();
        }
    </script>
</body>
</html>
